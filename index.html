<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kai Demo</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=0-0000000000"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '0-0000000000');
    </script>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>

    <style>
        body { background-color: #26282A; margin: 0; padding: 15px; font-family: arial, sans-serif; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .card { background-color: rgb(40, 38, 42); border: 2px solid rgb(40, 38, 42); padding: 10px; margin-bottom: 1em; position: relative; border-radius: 4px; }

        /* HIDE NATIVE AR BUTTONS */
        model-viewer::part(default-ar-button) { display: none !important; }

        .ar-button { 
            background-color: #017CB3; border-radius: 8px; border: 1px solid white; 
            position: absolute; top: 10px; right: 10px; height: 40px; 
            color: white; padding: 0 15px; cursor: pointer; z-index: 15; font-weight: bold;
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 20;
            display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 4px;
        }
        #overlay.hide { display: none; }
        .play-trigger { background: #017CB3; color: white; border: 1px solid white; padding: 15px 30px; border-radius: 8px; font-weight: bold; }

        model-viewer { width: 100%; height: 600px; --progress-bar-color: #017CB3; }
        .marginauto { margin: 10px auto; display: block; }
        a { color: #017CB3; text-decoration: none; font-weight: bold; }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <img class="marginauto" src="images/AVERtek-Logo-final-white.png" alt="Logo" style="width: 300px; height: auto"> 
            <h1 style="text-align: center; color:#FFFFFF; font-size: 24px;">BRAND. STORYTELLING. REALITY.</h1> 
            <h2 style="text-align: center; color:#017CB3; font-size: 20px;">IMAGINATION CONCEIVED!</h2>
        </div>

        <div class="card" style="padding:0; overflow: hidden;">
            <div id="overlay" onclick="startExperience()">
                <div class="play-trigger">CLICK TO START EXPERIENCE</div>
            </div>

            <model-viewer id="model-viewer" 
                src="Models/HKAI_DANCING_TEST.glb" 
                ios-src="Models/Human_kai_40.usdz#allowsScaling=1"
                ar ar-modes="webxr scene-viewer quick-look" 
                ar-placement="floor" camera-controls 
                autoplay animation-name="*"
                interaction-prompt="none" loading="eager">
                
                <button slot="ar-button" class="ar-button" id="ar-launcher">
                    👆 <strong style="color:white;">AUGMENTED REALITY!</strong>
                </button>
            </model-viewer>
        </div>

        <div class="card" style="text-align: center;">
            <h1 style="color:#FFFFFF;">EXPERIENTIAL</h1>
            <audio controls id="sound" style="width: 100%;">
                <source id="audio-source" src="Sound/Kai Story human_v2.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="card" style="text-align: center; color:#ffdf00; line-height: 1.8;">
            <h1 style="color:#FFFFFF;"><em>Answers to Critical Questions:</em></h1>
            <p>
                <b>DISCOVER:</b> <a href="#" onclick="getOutboundLink('https://vimeo.com/899988851/5cb3fc9712');">STORY & BRAND AWARENESS</a><br>
                <b>ENGAGE:</b> <a href="#" onclick="getOutboundLink('https://avertek.net/ar-examples');">UNIQUE SELLING PROPOSTIONS</a><br>
                <b>EXPLORE:</b> <a href="#" onclick="getOutboundLink('https://avertek.net/');">FEATURES, ADVANTAGES, BENEFITS</a><br>
                <b>REALIZE:</b> <a href="#" onclick="getOutboundLink('https://avertek.net/xr-now');">VALUE</a><br>
                <b>CONTINUE:</b> <a href="#" onclick="getOutboundLink('https://avertek.net/contact-us');">THE STORY</a>
            </p>
        </div>

        <div class="card">
            <img alt="AR Instructions" src="images/AR Instructions wht-trans3.png" class="marginauto" style="max-width: 100%; max-height: 350px">
        </div>
    </div>

    <script>
        const modelViewer = document.querySelector("#model-viewer");
        const audio = document.querySelector("#sound");
        const audioSource = document.querySelector("#audio-source");
        const overlay = document.querySelector("#overlay");
        const arLauncher = document.querySelector("#ar-launcher");

        const webAudio = "Sound/Kai Story human_v2.mp3"; 
        const arAudio = "Sound/K18 Edit 57sec_3.mp3";   

        function startExperience() {
            overlay.classList.add("hide");
            audio.play();
            modelViewer.play();
        }

        // --- AR LAUNCHER WITH READY-CHECK TO PREVENT BLACK SCREEN ---
        arLauncher.addEventListener('click', (e) => {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            if (!isMobile) {
                alert("The Augmented Reality experience requires a mobile device. Please visit this page on your phone!");
                return;
            }

            // Prepare Audio for AR
            audio.pause();
            audioSource.src = arAudio;
            audio.load();

            // Prime audio to bypass auto-play blocks
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(e => console.log("Audio prime blocked"));

            // Change Source to High Quality AR Model
            modelViewer.src = "Models/Hkai_final.glb"; 
            modelViewer.autoplay = true;

            // THE FIX: Wait for model to be fully ready before launching AR
            const launchARWhenReady = () => {
                modelViewer.activateAR();
                modelViewer.removeEventListener('poster-dismissed', launchARWhenReady);
            };

            modelViewer.addEventListener('poster-dismissed', launchARWhenReady);

            // Fallback for slower connections (max 2.5 seconds)
            setTimeout(() => {
                if (modelViewer.src.includes("Hkai_final.glb")) {
                    modelViewer.activateAR();
                }
            }, 2500);
        });

        // --- AR STATUS HANDLER ---
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'object-placed') {
                audio.play();
                modelViewer.play(); // Force movement once placed
            }

            if (event.detail.status === 'not-presenting') {
                audio.pause();
                audioSource.src = webAudio;
                audio.load();
                
                if(!overlay.classList.contains("hide")) return;
                
                setTimeout(() => {
                    audio.play();
                    modelViewer.play();
                }, 800);
            }
        });

        // --- SYNC & CONTROL ---
        audio.addEventListener("timeupdate", () => {
            if (!isNaN(audio.currentTime) && !modelViewer.paused) {
                modelViewer.currentTime = audio.currentTime;
            }
        });

        audio.addEventListener("play", () => modelViewer.play());
        audio.addEventListener("pause", () => modelViewer.pause());

        var getOutboundLink = function(url) {
            gtag('event', 'click', {
                'event_category': 'outbound',
                'event_label': url,
                'transport_type': 'beacon',
                'event_callback': function(){ window.open(url, '_blank'); }
            });
        }
    </script>
</body>
</html>
